name: Redirect old Pages to WebDemo

# 옛 github.io/Starlight-Sudoku → Starlight-Sudoku-WebDemo
# 마케팅 CTA(https://starlight-sudoku.tycheworks.com/)가 아직 옛 URL을 가리킴.

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-redirect
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
