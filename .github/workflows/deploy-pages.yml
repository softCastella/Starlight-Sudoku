name: Deploy Flutter web to GitHub Pages (retired)

# 웹 데모는 softCastella/Starlight-Sudoku-WebDemo 로 이전했다.
# 이 워크플로는 앱 리포에서 더 이상 배포하지 않는다.
# 공개 웹: https://softcastella.github.io/Starlight-Sudoku-WebDemo/

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Do not use — web demo moved to Starlight-Sudoku-WebDemo'
        required: true
        default: 'retired'

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Web demo moved
        run: |
          echo "Web demo lives at https://github.com/softCastella/Starlight-Sudoku-WebDemo"
          echo "Public URL: https://softcastella.github.io/Starlight-Sudoku-WebDemo/"
          exit 1
